<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI着物試着デモ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;600&display=swap');
    body { font-family: 'Noto Sans JP', sans-serif; }
    .font-serif-jp { font-family: 'Noto Serif JP', serif; }
    .kimono-card { transition: all 0.2s ease; }
    .kimono-card:hover { transform: translateY(-2px); }
    .kimono-card.selected { transform: translateY(-2px); }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .shimmer {
      background: linear-gradient(90deg, #f3e8ff 25%, #e9d5ff 50%, #f3e8ff 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.5s ease forwards; }
    .drop-zone { transition: all 0.2s ease; }
    .drop-zone.dragging { background-color: #f3e8ff; border-color: #9333ea; }
  </style>
</head>
<body class="bg-gradient-to-b from-purple-50 to-pink-50 min-h-screen">

<div id="root"></div>

<script type="text/babel">
const { useState, useRef, useCallback } = React;

const KIMONOS = [
  {
    id: 'furisode',
    name: '振袖',
    emoji: '🌸',
    description: '華やかな長袖の正礼装',
    color: '#e11d48',
    colorName: '深紅・金',
    pattern: '牡丹・鶴',
    occasion: '成人式・結婚式',
    gradient: 'from-red-400 to-pink-600',
    bgLight: 'bg-red-50',
    border: 'border-red-400',
    ring: 'ring-red-400',
    badge: 'bg-red-100 text-red-700',
  },
  {
    id: 'houmongi',
    name: '訪問着',
    emoji: '🌊',
    description: '上品な絵羽模様の準礼装',
    color: '#1d4ed8',
    colorName: '藍・白',
    pattern: '波・松竹梅',
    occasion: '茶会・パーティ',
    gradient: 'from-blue-500 to-indigo-700',
    bgLight: 'bg-blue-50',
    border: 'border-blue-400',
    ring: 'ring-blue-400',
    badge: 'bg-blue-100 text-blue-700',
  },
  {
    id: 'yukata',
    name: '浴衣',
    emoji: '🎆',
    description: '夏の爽やかな木綿着物',
    color: '#059669',
    colorName: '白・紺',
    pattern: '朝顔・花火',
    occasion: '夏祭り・花火大会',
    gradient: 'from-teal-400 to-emerald-600',
    bgLight: 'bg-teal-50',
    border: 'border-teal-400',
    ring: 'ring-teal-400',
    badge: 'bg-teal-100 text-teal-700',
  },
];

function KimonoCard({ kimono, selected, onSelect }) {
  return (
    <button
      onClick={() => onSelect(kimono)}
      className={`kimono-card relative w-full rounded-2xl p-4 border-2 text-left transition-all
        ${selected
          ? `${kimono.border} ${kimono.bgLight} ring-2 ${kimono.ring} ring-offset-1 shadow-lg`
          : 'border-gray-200 bg-white hover:border-gray-300 shadow-sm hover:shadow-md'
        }`}
    >
      {selected && (
        <span className="absolute top-2 right-2 w-5 h-5 rounded-full bg-current flex items-center justify-center"
          style={{ backgroundColor: kimono.color }}>
          <svg className="w-3 h-3 text-white" fill="currentColor" viewBox="0 0 20 20">
            <path fillRule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clipRule="evenodd"/>
          </svg>
        </span>
      )}
      <div className={`w-12 h-12 rounded-xl bg-gradient-to-br ${kimono.gradient} flex items-center justify-center text-2xl mb-3 shadow-sm`}>
        {kimono.emoji}
      </div>
      <div className="font-serif-jp font-bold text-lg text-gray-900">{kimono.name}</div>
      <div className="text-xs text-gray-500 mt-0.5 mb-2">{kimono.description}</div>
      <div className="flex flex-wrap gap-1">
        <span className={`text-xs px-2 py-0.5 rounded-full font-medium ${kimono.badge}`}>
          {kimono.colorName}
        </span>
        <span className="text-xs px-2 py-0.5 rounded-full font-medium bg-gray-100 text-gray-600">
          {kimono.occasion}
        </span>
      </div>
    </button>
  );
}

function ResultCard({ result }) {
  if (!result) return null;
  const items = [
    { label: '全体印象', key: 'overall_impression', icon: '✨' },
    { label: '着こなし', key: 'kimono_fit', icon: '👘' },
    { label: '色調バランス', key: 'color_harmony', icon: '🎨' },
    { label: 'スタイリング', key: 'style_advice', icon: '💡' },
    { label: 'おすすめシーン', key: 'scene_suggestion', icon: '📍' },
  ];
  return (
    <div className="fade-in space-y-3">
      {items.map(({ label, key, icon }) =>
        result[key] ? (
          <div key={key} className="bg-white rounded-xl p-4 shadow-sm border border-purple-100">
            <div className="flex items-center gap-2 mb-1.5">
              <span className="text-base">{icon}</span>
              <span className="text-xs font-semibold text-purple-600 uppercase tracking-wide">{label}</span>
            </div>
            <p className="text-sm text-gray-700 leading-relaxed">{result[key]}</p>
          </div>
        ) : null
      )}
    </div>
  );
}

function App() {
  const [photo, setPhoto] = useState(null);
  const [photoPreview, setPhotoPreview] = useState(null);
  const [selectedKimono, setSelectedKimono] = useState(null);
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const [error, setError] = useState(null);
  const [dragging, setDragging] = useState(false);
  const fileInputRef = useRef(null);
  const resultRef = useRef(null);

  const handleFile = useCallback((file) => {
    if (!file || !file.type.startsWith('image/')) {
      setError('画像ファイルを選択してください');
      return;
    }
    if (file.size > 5 * 1024 * 1024) {
      setError('5MB以下の画像を選択してください');
      return;
    }
    setError(null);
    setResult(null);
    setPhoto(file);
    const reader = new FileReader();
    reader.onload = (e) => setPhotoPreview(e.target.result);
    reader.readAsDataURL(file);
  }, []);

  const handleDrop = useCallback((e) => {
    e.preventDefault();
    setDragging(false);
    const file = e.dataTransfer.files[0];
    handleFile(file);
  }, [handleFile]);

  const handleGenerate = async () => {
    if (!photo || !selectedKimono) return;
    setLoading(true);
    setError(null);
    setResult(null);

    try {
      const base64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const dataUrl = e.target.result;
          resolve(dataUrl.split(',')[1]);
        };
        reader.onerror = reject;
        reader.readAsDataURL(photo);
      });

      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          imageBase64: base64,
          imageMediaType: photo.type,
          kimonoName: selectedKimono.name,
          kimonoDescription: selectedKimono.description,
          kimonoColor: selectedKimono.colorName,
        }),
      });

      const data = await res.json();
      if (data.error) {
        setError(data.error);
      } else {
        setResult(data.result);
        setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth' }), 100);
      }
    } catch (e) {
      setError('サーバーへの接続に失敗しました。サーバーが起動しているか確認してください。');
    } finally {
      setLoading(false);
    }
  };

  const canGenerate = photo && selectedKimono && !loading;

  return (
    <div className="min-h-screen pb-12">
      {/* Header */}
      <header className="bg-white/80 backdrop-blur-sm border-b border-purple-100 sticky top-0 z-10">
        <div className="max-w-md mx-auto px-4 py-3 flex items-center gap-2">
          <span className="text-2xl">👘</span>
          <div>
            <h1 className="font-serif-jp font-bold text-gray-900 text-base leading-tight">AI着物試着</h1>
            <p className="text-xs text-gray-400">Powered by Claude claude-opus-4-6</p>
          </div>
        </div>
      </header>

      <main className="max-w-md mx-auto px-4 pt-6 space-y-6">

        {/* Step 1: Photo Upload */}
        <section>
          <div className="flex items-center gap-2 mb-3">
            <span className="w-6 h-6 rounded-full bg-purple-600 text-white text-xs font-bold flex items-center justify-center">1</span>
            <h2 className="font-semibold text-gray-800">写真をアップロード</h2>
          </div>

          <div
            className={`drop-zone border-2 border-dashed rounded-2xl overflow-hidden ${dragging ? 'dragging' : 'border-purple-200'}`}
            onDragOver={(e) => { e.preventDefault(); setDragging(true); }}
            onDragLeave={() => setDragging(false)}
            onDrop={handleDrop}
          >
            {photoPreview ? (
              <div className="relative">
                <img src={photoPreview} alt="アップロード済み" className="w-full h-56 object-cover" />
                <div className="absolute inset-0 bg-black/20 flex items-center justify-center opacity-0 hover:opacity-100 transition-opacity">
                  <button
                    onClick={() => fileInputRef.current?.click()}
                    className="bg-white/90 text-gray-800 text-sm font-medium px-4 py-2 rounded-full shadow"
                  >
                    写真を変更
                  </button>
                </div>
                <div className="absolute bottom-2 right-2">
                  <span className="bg-green-500 text-white text-xs px-2 py-1 rounded-full font-medium">
                    ✓ アップロード済み
                  </span>
                </div>
              </div>
            ) : (
              <button
                onClick={() => fileInputRef.current?.click()}
                className="w-full p-8 flex flex-col items-center gap-3 hover:bg-purple-50/50 transition-colors"
              >
                <div className="w-16 h-16 rounded-2xl bg-purple-100 flex items-center justify-center">
                  <svg className="w-8 h-8 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                  </svg>
                </div>
                <div className="text-center">
                  <p className="text-sm font-medium text-gray-700">タップして写真を選択</p>
                  <p className="text-xs text-gray-400 mt-0.5">またはドラッグ＆ドロップ · JPG, PNG · 5MB以下</p>
                </div>
              </button>
            )}
          </div>
          <input ref={fileInputRef} type="file" accept="image/*" capture="user" className="hidden"
            onChange={(e) => handleFile(e.target.files[0])} />
        </section>

        {/* Step 2: Kimono Selection */}
        <section>
          <div className="flex items-center gap-2 mb-3">
            <span className="w-6 h-6 rounded-full bg-purple-600 text-white text-xs font-bold flex items-center justify-center">2</span>
            <h2 className="font-semibold text-gray-800">着物を選択</h2>
          </div>
          <div className="grid grid-cols-3 gap-3">
            {KIMONOS.map(kimono => (
              <KimonoCard
                key={kimono.id}
                kimono={kimono}
                selected={selectedKimono?.id === kimono.id}
                onSelect={setSelectedKimono}
              />
            ))}
          </div>
        </section>

        {/* Generate Button */}
        <section>
          {error && (
            <div className="mb-3 bg-red-50 border border-red-200 rounded-xl px-4 py-3 flex items-start gap-2">
              <svg className="w-4 h-4 text-red-500 mt-0.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                <path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clipRule="evenodd"/>
              </svg>
              <p className="text-sm text-red-600">{error}</p>
            </div>
          )}

          <button
            onClick={handleGenerate}
            disabled={!canGenerate}
            className={`w-full py-4 rounded-2xl font-bold text-base transition-all duration-200 shadow-lg
              ${canGenerate
                ? 'bg-gradient-to-r from-purple-600 to-pink-600 text-white hover:from-purple-700 hover:to-pink-700 active:scale-95 shadow-purple-200'
                : 'bg-gray-100 text-gray-400 cursor-not-allowed shadow-none'
              }`}
          >
            {loading ? (
              <span className="flex items-center justify-center gap-2">
                <svg className="animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24">
                  <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/>
                  <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
                </svg>
                AI分析中...
              </span>
            ) : (
              <span className="flex items-center justify-center gap-2">
                <span>👘</span>
                {!photo ? '写真をアップロードしてください' : !selectedKimono ? '着物を選んでください' : 'AI試着を生成'}
              </span>
            )}
          </button>

          {!photo || !selectedKimono ? (
            <p className="text-center text-xs text-gray-400 mt-2">
              {!photo && !selectedKimono ? '写真と着物の両方を選択してください'
                : !photo ? '写真をアップロードしてください'
                : '着物を選んでください'}
            </p>
          ) : null}
        </section>

        {/* Step 3: Result */}
        {(result || loading) && (
          <section ref={resultRef}>
            <div className="flex items-center gap-2 mb-3">
              <span className="w-6 h-6 rounded-full bg-purple-600 text-white text-xs font-bold flex items-center justify-center">3</span>
              <h2 className="font-semibold text-gray-800">AI試着レポート</h2>
              {selectedKimono && (
                <span className={`ml-auto text-xs px-2 py-0.5 rounded-full font-medium ${selectedKimono.badge}`}>
                  {selectedKimono.emoji} {selectedKimono.name}
                </span>
              )}
            </div>

            {loading ? (
              <div className="space-y-3">
                {[...Array(5)].map((_, i) => (
                  <div key={i} className="bg-white rounded-xl p-4 shadow-sm border border-purple-100">
                    <div className="shimmer h-3 w-20 rounded mb-2" />
                    <div className="shimmer h-4 w-full rounded mb-1" />
                    <div className="shimmer h-4 w-4/5 rounded" />
                  </div>
                ))}
              </div>
            ) : (
              <ResultCard result={result} />
            )}
          </section>
        )}

      </main>

      {/* Footer */}
      <footer className="max-w-md mx-auto px-4 mt-8 text-center">
        <p className="text-xs text-gray-400">Claude Vision APIによるAI分析 · 画像はサーバーに保存されません</p>
      </footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
