<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI着物試着デモ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;600&display=swap');
    body { font-family: 'Noto Sans JP', sans-serif; background: #faf5ff; }
    .font-serif-jp { font-family: 'Noto Serif JP', serif; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeInUp 0.5s ease forwards; }

    @keyframes pulse-ring {
      0%   { transform: scale(1);   opacity: 1; }
      100% { transform: scale(1.8); opacity: 0; }
    }
    .processing-dot::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: currentColor;
      animation: pulse-ring 1.4s ease-out infinite;
    }

    .upload-zone { transition: all 0.2s ease; }
    .upload-zone.drag-over { background: #f3e8ff; border-color: #9333ea; transform: scale(1.01); }
    .upload-zone:hover { border-color: #a855f7; background: #fdf4ff; }

    @keyframes shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .shimmer {
      background: linear-gradient(90deg, #f3e8ff 25%, #e9d5ff 50%, #f3e8ff 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }

    .result-img {
      animation: fadeInUp 0.6s ease;
      transition: transform 0.2s;
    }
    .result-img:hover { transform: scale(1.01); }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useRef, useCallback, useEffect } = React;

// ─── Image resize/compress via Canvas ──────────────────────────────────────
async function compressImage(file, maxPx = 1024, quality = 0.85) {
  return new Promise((resolve) => {
    const img = new Image();
    const objectUrl = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(objectUrl);
      let { width, height } = img;
      if (width > maxPx || height > maxPx) {
        if (width >= height) { height = Math.round(height * maxPx / width); width = maxPx; }
        else                 { width = Math.round(width * maxPx / height);  height = maxPx; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      canvas.toBlob(blob => {
        const reader = new FileReader();
        reader.onload = e => resolve({
          base64: e.target.result.split(',')[1],
          mediaType: 'image/jpeg',
          previewUrl: e.target.result,
          sizePx: `${width}×${height}`
        });
        reader.readAsDataURL(blob);
      }, 'image/jpeg', quality);
    };
    img.src = objectUrl;
  });
}

// ─── Kimono presets ──────────────────────────────────────────────────────────
const PRESETS = [
  { id: 'red',   label: '赤振袖', src: '/public/kimonos/red.jpg',   color: 'from-red-400 to-rose-600',   ring: 'ring-red-400',   bg: 'bg-red-50',   border: 'border-red-300'   },
  { id: 'blue',  label: '青振袖', src: '/public/kimonos/blue.jpg',  color: 'from-blue-400 to-indigo-600', ring: 'ring-blue-400',  bg: 'bg-blue-50',  border: 'border-blue-300'  },
  { id: 'black', label: '黒振袖', src: '/public/kimonos/black.jpg', color: 'from-gray-700 to-gray-900',  ring: 'ring-gray-500',  bg: 'bg-gray-50',  border: 'border-gray-400'  },
];

async function compressImageFromUrl(url, maxPx = 768, quality = 0.85) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      let { width, height } = img;
      if (width > maxPx || height > maxPx) {
        if (width >= height) { height = Math.round(height * maxPx / width); width = maxPx; }
        else                 { width  = Math.round(width  * maxPx / height); height = maxPx; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      canvas.toBlob(blob => {
        const reader = new FileReader();
        reader.onload = e => resolve({
          base64: e.target.result.split(',')[1],
          mediaType: 'image/jpeg',
          previewUrl: e.target.result,
          sizePx: `${width}×${height}`
        });
        reader.readAsDataURL(blob);
      }, 'image/jpeg', quality);
    };
    img.onerror = () => reject(new Error(`プリセット画像を読み込めませんでした: ${url}`));
    img.src = url;
  });
}

// ─── Upload Zone Component ───────────────────────────────────────────────────
function UploadZone({ label, icon, preview, onFile, hint }) {
  const [dragging, setDragging] = useState(false);
  const inputRef = useRef(null);

  const handleDrop = useCallback((e) => {
    e.preventDefault(); setDragging(false);
    const f = e.dataTransfer.files[0];
    if (f && f.type.startsWith('image/')) onFile(f);
  }, [onFile]);

  return (
    <div
      className={`upload-zone border-2 border-dashed rounded-2xl overflow-hidden cursor-pointer
        ${dragging ? 'drag-over' : 'border-purple-200 bg-white'}`}
      onDragOver={e => { e.preventDefault(); setDragging(true); }}
      onDragLeave={() => setDragging(false)}
      onDrop={handleDrop}
      onClick={() => inputRef.current?.click()}
    >
      {preview ? (
        <div className="relative">
          <img src={preview} alt={label} className="w-full h-52 object-cover" />
          <div className="absolute inset-0 bg-black/0 hover:bg-black/25 flex items-center justify-center opacity-0 hover:opacity-100 transition-all">
            <span className="bg-white/90 text-gray-800 text-sm font-medium px-4 py-2 rounded-full shadow">
              変更する
            </span>
          </div>
          <span className="absolute top-2 right-2 bg-green-500 text-white text-xs px-2 py-1 rounded-full font-medium shadow">
            ✓ 読み込み済
          </span>
        </div>
      ) : (
        <div className="flex flex-col items-center justify-center gap-3 py-8 px-4">
          <div className="w-14 h-14 rounded-2xl bg-purple-100 flex items-center justify-center text-2xl">
            {icon}
          </div>
          <div className="text-center">
            <p className="text-sm font-semibold text-gray-700">{label}</p>
            <p className="text-xs text-gray-400 mt-0.5">{hint}</p>
          </div>
        </div>
      )}
      <input ref={inputRef} type="file" accept="image/*" capture="user"
        className="hidden" onChange={e => { if (e.target.files[0]) onFile(e.target.files[0]); }} />
    </div>
  );
}

// ─── Preset Kimono Cards ─────────────────────────────────────────────────────
function KimonoPresets({ selected, onSelect, loading: presetLoading }) {
  return (
    <div className="grid grid-cols-3 gap-2 mb-3">
      {PRESETS.map(p => (
        <button
          key={p.id}
          disabled={presetLoading === p.id}
          onClick={() => onSelect(p)}
          className={`relative rounded-xl overflow-hidden border-2 transition-all
            ${selected === p.id
              ? `${p.border} ring-2 ${p.ring} ring-offset-1 shadow-md`
              : 'border-gray-200 hover:border-gray-300 shadow-sm'}`}
        >
          {/* Thumbnail image */}
          <div className={`w-full aspect-[3/4] bg-gradient-to-b ${p.color} relative`}>
            <img
              src={p.src}
              alt={p.label}
              className="w-full h-full object-cover"
              onError={e => { e.currentTarget.style.display = 'none'; }}
            />
            {/* Loading spinner overlay */}
            {presetLoading === p.id && (
              <div className="absolute inset-0 bg-white/70 flex items-center justify-center">
                <svg className="animate-spin w-5 h-5 text-purple-500" fill="none" viewBox="0 0 24 24">
                  <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/>
                  <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
                </svg>
              </div>
            )}
            {/* Selected checkmark */}
            {selected === p.id && (
              <div className="absolute top-1 right-1 w-5 h-5 bg-green-500 rounded-full flex items-center justify-center shadow">
                <svg className="w-3 h-3 text-white" fill="currentColor" viewBox="0 0 20 20">
                  <path fillRule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clipRule="evenodd"/>
                </svg>
              </div>
            )}
          </div>
          <div className={`py-1.5 text-xs font-semibold text-center ${selected === p.id ? p.bg + ' text-gray-700' : 'bg-white text-gray-600'}`}>
            {p.label}
          </div>
        </button>
      ))}
    </div>
  );
}

// ─── Progress Indicator ──────────────────────────────────────────────────────
function ProcessingState({ elapsed }) {
  const steps = [
    { label: '画像をアップロード中', done: elapsed > 5 },
    { label: 'fal.ai にジョブを送信中', done: elapsed > 10 },
    { label: 'CatVTON で試着画像を生成中', done: elapsed > 90 },
    { label: '結果を取得中', done: false },
  ];
  const activeIdx = steps.findLastIndex(s => s.done);
  const currentIdx = Math.min(activeIdx + 1, steps.length - 1);

  return (
    <div className="bg-white rounded-2xl p-6 shadow-sm border border-purple-100">
      <div className="flex items-center gap-3 mb-5">
        <div className="relative w-6 h-6 text-purple-500 processing-dot">
          <div className="w-6 h-6 rounded-full bg-purple-500" />
        </div>
        <div>
          <p className="font-semibold text-gray-800 text-sm">AI試着画像を生成中…</p>
          <p className="text-xs text-gray-400">通常 30〜60 秒かかります（{elapsed}秒経過）</p>
        </div>
      </div>
      <div className="space-y-2.5">
        {steps.map((step, i) => (
          <div key={i} className="flex items-center gap-2.5">
            <div className={`w-5 h-5 rounded-full flex items-center justify-center text-xs flex-shrink-0
              ${step.done ? 'bg-green-500 text-white'
                : i === currentIdx ? 'bg-purple-500 text-white animate-pulse'
                : 'bg-gray-100 text-gray-300'}`}>
              {step.done ? '✓' : i + 1}
            </div>
            <span className={`text-sm ${step.done ? 'text-gray-400 line-through' : i === currentIdx ? 'text-gray-800 font-medium' : 'text-gray-300'}`}>
              {step.label}
            </span>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── Result Image ────────────────────────────────────────────────────────────
function ResultImage({ imageUrl, onReset }) {
  return (
    <div className="fade-in">
      <div className="bg-white rounded-2xl overflow-hidden shadow-lg border border-purple-100">
        <div className="relative">
          <img
            src={imageUrl}
            alt="AI生成着物試着結果"
            className="result-img w-full"
            onClick={() => window.open(imageUrl, '_blank')}
          />
          <div className="absolute bottom-3 right-3 flex gap-2">
            <a
              href={imageUrl}
              download="kimono-tryon.jpg"
              target="_blank"
              rel="noopener noreferrer"
              className="bg-white/90 backdrop-blur-sm text-gray-700 text-xs font-medium px-3 py-1.5 rounded-full shadow-md hover:bg-white transition-all flex items-center gap-1"
              onClick={e => e.stopPropagation()}
            >
              💾 保存
            </a>
            <button
              onClick={() => window.open(imageUrl, '_blank')}
              className="bg-white/90 backdrop-blur-sm text-gray-700 text-xs font-medium px-3 py-1.5 rounded-full shadow-md hover:bg-white transition-all"
            >
              🔍 拡大
            </button>
          </div>
        </div>
        <div className="px-4 py-3 flex items-center justify-between bg-purple-50/60">
          <div className="flex items-center gap-2">
            <span className="text-green-500 text-sm">✨</span>
            <span className="text-sm text-gray-600 font-medium">Generated by fal.ai CatVTON</span>
          </div>
          <button
            onClick={onReset}
            className="text-xs text-purple-600 font-semibold px-3 py-1.5 rounded-full bg-white border border-purple-200 hover:bg-purple-50 transition-all"
          >
            🔄 もう一度試す
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── Main App ────────────────────────────────────────────────────────────────
function App() {
  const [person, setPerson] = useState(null);        // { base64, mediaType, previewUrl }
  const [kimono, setKimono] = useState(null);        // { base64, mediaType, previewUrl }
  const [selectedPreset, setSelectedPreset] = useState(null); // preset id string
  const [presetLoading, setPresetLoading] = useState(null);   // preset id being loaded
  const [loading, setLoading] = useState(false);
  const [elapsed, setElapsed] = useState(0);
  const [resultUrl, setResultUrl] = useState(null);
  const [error, setError] = useState(null);
  const resultRef = useRef(null);
  const timerRef = useRef(null);

  // Start elapsed timer while loading
  useEffect(() => {
    if (loading) {
      setElapsed(0);
      timerRef.current = setInterval(() => setElapsed(s => s + 1), 1000);
    } else {
      clearInterval(timerRef.current);
    }
    return () => clearInterval(timerRef.current);
  }, [loading]);

  const handlePersonFile = useCallback(async (file) => {
    setError(null); setResultUrl(null);
    const data = await compressImage(file, 1024);
    setPerson(data);
  }, []);

  const handleKimonoFile = useCallback(async (file) => {
    setError(null); setResultUrl(null);
    setSelectedPreset(null);
    const data = await compressImage(file, 768);
    setKimono(data);
  }, []);

  const handlePresetSelect = useCallback(async (preset) => {
    if (selectedPreset === preset.id) return; // already selected
    setError(null); setResultUrl(null);
    setSelectedPreset(preset.id);
    setPresetLoading(preset.id);
    try {
      const data = await compressImageFromUrl(preset.src);
      setKimono(data);
    } catch (e) {
      setError(`プリセット画像の読み込みに失敗: ${e.message}`);
      setSelectedPreset(null);
    } finally {
      setPresetLoading(null);
    }
  }, [selectedPreset]);

  const handleGenerate = async () => {
    if (!person || !kimono) return;
    setLoading(true); setError(null); setResultUrl(null);
    try {
      const res = await fetch('/api/tryon', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          personBase64: person.base64,
          personMediaType: person.mediaType,
          kimonoBase64: kimono.base64,
          kimonoMediaType: kimono.mediaType,
        }),
      });
      const data = await res.json();
      if (data.error) { setError(data.error); return; }
      setResultUrl(data.imageUrl);
      setTimeout(() => resultRef.current?.scrollIntoView({ behavior: 'smooth' }), 100);
    } catch (e) {
      setError('サーバーへの接続に失敗しました。node server.js が起動しているか確認してください。');
    } finally {
      setLoading(false);
    }
  };

  const handleReset = () => {
    setResultUrl(null); setError(null); setElapsed(0);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  const canGenerate = person && kimono && !loading;

  return (
    <div className="min-h-screen pb-16">

      {/* ── Header ── */}
      <header className="bg-white/80 backdrop-blur-sm border-b border-purple-100 sticky top-0 z-20">
        <div className="max-w-md mx-auto px-4 py-3 flex items-center gap-3">
          <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center text-lg shadow-sm">
            👘
          </div>
          <div>
            <h1 className="font-serif-jp font-bold text-gray-900 text-base leading-tight">AI着物試着</h1>
            <p className="text-xs text-gray-400">fal.ai CatVTON × Virtual Try-On</p>
          </div>
        </div>
      </header>

      <main className="max-w-md mx-auto px-4 pt-6 space-y-5">

        {/* ── Step 1: Person photo ── */}
        <section>
          <StepHeader num={1} title="あなたの写真" done={!!person} />
          <UploadZone
            label="人物写真をアップロード"
            icon="📷"
            hint="全身 or 上半身・JPG / PNG · 5MB以下"
            preview={person?.previewUrl}
            onFile={handlePersonFile}
          />
          {person && (
            <p className="text-xs text-gray-400 mt-1.5 ml-1">
              読み込み完了 ({person.sizePx})
            </p>
          )}
        </section>

        {/* ── Step 2: Kimono image ── */}
        <section>
          <StepHeader num={2} title="着物を選択" done={!!kimono} />

          {/* Preset cards */}
          <KimonoPresets
            selected={selectedPreset}
            onSelect={handlePresetSelect}
            loading={presetLoading}
          />

          {/* Divider */}
          <div className="flex items-center gap-2 my-3">
            <div className="flex-1 h-px bg-gray-200" />
            <span className="text-xs text-gray-400 font-medium">または独自の着物画像をアップロード</span>
            <div className="flex-1 h-px bg-gray-200" />
          </div>

          {/* Custom upload */}
          <UploadZone
            label="着物 / 衣装画像をアップロード"
            icon="👘"
            hint="着物・浴衣・和服など · JPG / PNG · 5MB以下"
            preview={!selectedPreset ? kimono?.previewUrl : null}
            onFile={handleKimonoFile}
          />
          {kimono && (
            <p className="text-xs text-gray-400 mt-1.5 ml-1">
              {selectedPreset
                ? `${PRESETS.find(p => p.id === selectedPreset)?.label} を選択中 (${kimono.sizePx})`
                : `カスタム画像 (${kimono.sizePx})`}
            </p>
          )}
        </section>

        {/* ── Divider with arrow ── */}
        {person && kimono && !loading && !resultUrl && (
          <div className="flex flex-col items-center gap-1 py-1 fade-in">
            <div className="w-0.5 h-6 bg-purple-200 rounded" />
            <div className="text-purple-400 text-lg">▼</div>
          </div>
        )}

        {/* ── Error ── */}
        {error && (
          <div className="bg-red-50 border border-red-200 rounded-xl px-4 py-3 flex gap-2 fade-in">
            <span className="text-red-400 mt-0.5">⚠️</span>
            <p className="text-sm text-red-600 leading-relaxed">{error}</p>
          </div>
        )}

        {/* ── Generate Button ── */}
        {!resultUrl && (
          <button
            onClick={handleGenerate}
            disabled={!canGenerate}
            className={`w-full py-4 rounded-2xl font-bold text-base transition-all duration-200
              ${canGenerate
                ? 'bg-gradient-to-r from-purple-600 to-pink-600 text-white shadow-lg shadow-purple-200 hover:shadow-purple-300 active:scale-95'
                : 'bg-gray-100 text-gray-400 cursor-not-allowed'
              }`}
          >
            {loading ? (
              <span className="flex items-center justify-center gap-2">
                <svg className="animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24">
                  <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/>
                  <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
                </svg>
                処理中 ({elapsed}秒)
              </span>
            ) : (
              <span className="flex items-center justify-center gap-2">
                <span>✨</span>
                {!person && !kimono ? '写真と着物を選んでください'
                  : !person ? '人物写真を選んでください'
                  : !kimono ? '着物画像を選んでください'
                  : 'AI試着を生成する'}
              </span>
            )}
          </button>
        )}

        {/* ── Processing state ── */}
        {loading && (
          <section>
            <ProcessingState elapsed={elapsed} />
          </section>
        )}

        {/* ── Result ── */}
        {resultUrl && (
          <section ref={resultRef}>
            <StepHeader num={3} title="生成結果" done />
            <ResultImage imageUrl={resultUrl} onReset={handleReset} />
          </section>
        )}

      </main>

      {/* ── Footer ── */}
      <footer className="max-w-md mx-auto px-4 mt-10 text-center">
        <p className="text-xs text-gray-400">
          fal.ai CatVTON による仮想試着 · 画像はサーバーに保存されません
        </p>
      </footer>
    </div>
  );
}

// Step header sub-component
function StepHeader({ num, title, done }) {
  return (
    <div className="flex items-center gap-2 mb-2.5">
      <span className={`w-6 h-6 rounded-full text-xs font-bold flex items-center justify-center transition-colors
        ${done ? 'bg-green-500 text-white' : 'bg-purple-600 text-white'}`}>
        {done ? '✓' : num}
      </span>
      <h2 className="font-semibold text-gray-800 text-sm">{title}</h2>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
