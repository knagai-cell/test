positioning: "専門卒・営業経験なし・非AI企業出身から、独学でAIを学び、現在AI顧問5社を担当している実務型AI顧問"
target_reader: "個人事業主や会社員で、これからAI顧問・AIコンサルでマネタイズしたい人、独立したい人"
tone:
  - 親しみやすい
  - 熱量高め
  - 現実的
  - 初心者にわかりやすい
  - 煽りすぎない
story_elements:
  - 専門卒
  - システム会社やAI企業出身ではない
  - 営業経験なし
  - 物販やSNS運用代行で失敗
  - 前職の会社員時代から独学でAIを勉強
  - ChatGPT、Claude、Claude Code、Geminiを活用
  - 現在フリーランスでAI顧問5社
strengths:
  - 相手に寄り添って考える
  - ITやAIに詳しくない人にも簡単に説明できる
  - 実務目線でAI活用を提案できる
avoid_words:
  - 誰でも簡単に稼げる
  - 放置で月収100万円
  - 必ず稼げる
  - AIだけで不労所得
  - 情弱
