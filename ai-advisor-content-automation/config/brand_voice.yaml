note_account:
  url: "https://note.com/_raccoon_ai"
  display_name: "らくーんAI｜実務型AI顧問"
  bio: |
    専門卒。営業経験なし。システム会社やAI企業の出身でもありません。
    物販やSNS運用代行で失敗し、会社員時代に「自分の仕事をAIで効率化してみよう」と独学でChatGPT・Claude・Claude Codeを触り始めたのがすべてのきっかけでした。
    やっていく中で「これ、教えてほしい」と言われることが増え、気づけばフリーランスとしてAI顧問5社を担当するようになりました。
    このnoteでは、AIの専門家でも元エンジニアでもない自分が、どうやってAI顧問として仕事を取り、続けているのかを実体験ベースで書いています。
    ・AI顧問の始め方と最初の1社の取り方
    ・営業なしでクライアントを増やす方法
    ・提案テンプレートと実務の進め方
    ・AI顧問として独立するまでのリアルな過程
    「AIは学んだけど、どうやってお金にすればいいかわからない」そんな過去の自分と同じ状況の方に届けたいと思って書いています。
    X：@_raccoon_ai

positioning: "専門卒・営業経験なし・非AI企業出身から、独学でAIを学び、現在AI顧問5社を担当している実務型AI顧問"
