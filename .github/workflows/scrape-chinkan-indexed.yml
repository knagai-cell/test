name: Scrape Chinkan indexed public emails
on:
  push:
    branches: [automation/real-estate-leads-2000-v2]
    paths:
      - 'chinkan_index_scraper/**'
      - '.github/workflows/scrape-chinkan-indexed.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python chinkan_index_scraper/scrape_indexed.py
      - uses: actions/upload-artifact@v4
        with:
          name: chinkan-indexed-public-real-estate-emails
          path: chinkan_index_output/
          if-no-files-found: error
          retention-days: 7
