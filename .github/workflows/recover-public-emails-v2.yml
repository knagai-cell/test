name: Recover public real estate emails v2
on:
  push:
    branches: [automation/real-estate-leads-2000-v2]
    paths:
      - 'lead_recovery_v2/**'
      - '.github/workflows/recover-public-emails-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python lead_recovery_v2/recover_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: recovered-public-real-estate-emails-v2
          path: recovery_v2_output/
          if-no-files-found: error
          retention-days: 7
