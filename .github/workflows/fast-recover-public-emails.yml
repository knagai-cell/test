name: Fast recover public real estate emails
on:
  push:
    branches: [automation/real-estate-leads-2000-v2]
    paths:
      - 'lead_recovery_fast/**'
      - '.github/workflows/fast-recover-public-emails.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python lead_recovery_fast/fast_recover.py
      - uses: actions/upload-artifact@v4
        with:
          name: fast-recovered-public-real-estate-emails
          path: fast_recovery_output/
          if-no-files-found: error
          retention-days: 7
