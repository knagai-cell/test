name: Resolve public email-domain websites and contact forms

on:
  push:
    branches:
      - automation/resolve-email-domain-sites
    paths:
      - 'scripts/resolve_email_domain_sites.py'
      - '.github/workflows/resolve-email-domain-sites.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install aiohttp beautifulsoup4
      - name: Restore input CSV
        run: |
          mkdir -p data output
          cat \
            data/contact_input_part_01.txt \
            data/contact_input_small_02.txt \
            data/contact_input_part_03.txt \
            data/contact_input_part_04.txt \
            data/contact_input_part_05.txt \
            data/contact_input_part_06.txt \
            data/contact_input_part_07.txt \
            data/contact_input_part_08.txt \
            | base64 -d | gzip -d > data/contact_form_scan_input.csv
          test "$(($(wc -l < data/contact_form_scan_input.csv)-1))" -eq 2000
      - name: Resolve sites and forms
        run: python scripts/resolve_email_domain_sites.py data/contact_form_scan_input.csv output/email_domain_site_resolution.csv
      - uses: actions/upload-artifact@v4
        with:
          name: email-domain-site-resolution
          path: output/email_domain_site_resolution.csv
          retention-days: 7
