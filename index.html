<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 着物試着</title>
  <style>
    /* ── Reset & Base ─────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background: #faf7f4;
      color: #2c2c2c;
      min-height: 100vh;
    }

    /* ── Layout ───────────────────────────────────── */
    .app {
      max-width: 480px;
      margin: 0 auto;
      padding: 0 0 80px;
    }

    /* ── Header ───────────────────────────────────── */
    .header {
      background: linear-gradient(135deg, #8b1c3f 0%, #5c1230 100%);
      padding: 20px 20px 24px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 12px rgba(139,28,63,0.3);
    }
    .header h1 {
      color: #fff;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.15em;
    }
    .header p {
      color: rgba(255,255,255,0.8);
      font-size: 0.75rem;
      margin-top: 4px;
      letter-spacing: 0.05em;
    }

    /* ── Section Card ─────────────────────────────── */
    .section {
      margin: 16px 16px 0;
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .section-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #8b1c3f;
      text-transform: uppercase;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #f0e8ec;
    }

    /* ── API Key Input ────────────────────────────── */
    .api-key-input {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #e0d0d8;
      border-radius: 10px;
      font-size: 0.85rem;
      font-family: monospace;
      color: #2c2c2c;
      background: #fdf9fb;
      outline: none;
      transition: border-color 0.2s;
    }
    .api-key-input:focus { border-color: #8b1c3f; background: #fff; }
    .api-key-hint {
      font-size: 0.7rem;
      color: #999;
      margin-top: 6px;
    }

    /* ── Photo Upload ─────────────────────────────── */
    .upload-zone {
      border: 2px dashed #d4b8c4;
      border-radius: 14px;
      padding: 28px 20px;
      text-align: center;
      cursor: pointer;
      background: #fdf9fb;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }
    .upload-zone:hover, .upload-zone.drag-over {
      border-color: #8b1c3f;
      background: #fdf0f5;
    }
    .upload-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }
    .upload-icon {
      font-size: 2.5rem;
      margin-bottom: 8px;
      display: block;
    }
    .upload-text {
      font-size: 0.85rem;
      color: #8b1c3f;
      font-weight: 600;
    }
    .upload-sub {
      font-size: 0.7rem;
      color: #aaa;
      margin-top: 4px;
    }

    /* Photo preview */
    .photo-preview {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      aspect-ratio: 3/4;
      background: #f0e8ec;
    }
    .photo-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .photo-preview .change-btn {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(139,28,63,0.85);
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.75rem;
      cursor: pointer;
      font-weight: 600;
    }
    .photo-preview input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    /* ── Kimono Selector ──────────────────────────── */
    .kimono-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .kimono-card {
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      border: 2.5px solid transparent;
      transition: all 0.2s;
      background: #f0e8ec;
    }
    .kimono-card.selected {
      border-color: #8b1c3f;
      box-shadow: 0 0 0 3px rgba(139,28,63,0.15);
    }
    .kimono-card:hover { transform: translateY(-2px); }
    .kimono-visual {
      aspect-ratio: 2/3;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .kimono-visual svg {
      width: 80%;
      height: 80%;
    }
    .kimono-name {
      text-align: center;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 6px 4px;
      letter-spacing: 0.08em;
    }
    .kimono-check {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 20px;
      height: 20px;
      background: #8b1c3f;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 0.7rem;
    }
    .kimono-card.selected .kimono-check { display: flex; }

    /* ── Generate Button ──────────────────────────── */
    .generate-btn {
      display: block;
      width: calc(100% - 32px);
      margin: 16px 16px 0;
      padding: 16px;
      background: linear-gradient(135deg, #8b1c3f 0%, #c0396a 100%);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 16px rgba(139,28,63,0.35);
      position: relative;
      overflow: hidden;
    }
    .generate-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(139,28,63,0.45);
    }
    .generate-btn:disabled {
      background: linear-gradient(135deg, #c4a0b0 0%, #d4b4c4 100%);
      cursor: not-allowed;
      box-shadow: none;
    }
    .generate-btn .btn-icon { margin-right: 6px; }

    /* Shimmer animation on button */
    .generate-btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -75%;
      width: 50%;
      height: 200%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transform: skewX(-20deg);
    }
    .generate-btn:not(:disabled):hover::after {
      animation: shimmer 0.6s ease;
    }
    @keyframes shimmer {
      from { left: -75%; }
      to   { left: 125%; }
    }

    /* ── Loading ──────────────────────────────────── */
    .loading-card {
      margin: 16px 16px 0;
      background: #fff;
      border-radius: 16px;
      padding: 28px 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #f0e8ec;
      border-top-color: #8b1c3f;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: #8b1c3f; font-weight: 600; font-size: 0.9rem; }
    .loading-sub { color: #aaa; font-size: 0.75rem; margin-top: 6px; }

    /* ── Result ───────────────────────────────────── */
    .result-card {
      margin: 16px 16px 0;
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .result-header {
      background: linear-gradient(135deg, #8b1c3f 0%, #c0396a 100%);
      padding: 14px 20px;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .result-image-wrap {
      position: relative;
      background: #f7f0f4;
    }
    .result-canvas {
      width: 100%;
      display: block;
    }
    .result-kimono-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(139,28,63,0.85);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 0.08em;
    }
    .result-body {
      padding: 18px 20px;
    }
    .result-desc {
      font-size: 0.85rem;
      line-height: 1.75;
      color: #3c3c3c;
      white-space: pre-wrap;
    }
    .result-desc-label {
      font-size: 0.7rem;
      font-weight: 700;
      color: #8b1c3f;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
    }

    /* ── Error ────────────────────────────────────── */
    .error-card {
      margin: 16px 16px 0;
      background: #fff5f8;
      border: 1.5px solid #f0c0d0;
      border-radius: 14px;
      padding: 16px 20px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .error-icon { font-size: 1.25rem; flex-shrink: 0; }
    .error-text { font-size: 0.8rem; color: #8b1c3f; line-height: 1.6; }

    /* ── Retry Button ─────────────────────────────── */
    .retry-btn {
      display: block;
      width: calc(100% - 32px);
      margin: 12px 16px 0;
      padding: 12px;
      background: #fff;
      color: #8b1c3f;
      border: 2px solid #8b1c3f;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .retry-btn:hover { background: #fdf0f5; }

    /* ── Utilities ────────────────────────────────── */
    .hidden { display: none !important; }

    /* ── Pattern overlay colors for canvas ─────────── */
  </style>
</head>
<body>

<div class="app">

  <!-- Header -->
  <header class="header">
    <h1>👘 AI 着物試着</h1>
    <p>写真をアップして、AIで着物のイメージを生成</p>
  </header>

  <!-- Section 0: API Key -->
  <section class="section">
    <div class="section-label">🔑 Anthropic API Key</div>
    <input
      type="password"
      id="apiKey"
      class="api-key-input"
      placeholder="sk-ant-..."
      autocomplete="off"
    />
    <p class="api-key-hint">※ APIキーはブラウザ内のみで使用され、外部には送信されません</p>
  </section>

  <!-- Section 1: Photo Upload -->
  <section class="section">
    <div class="section-label">📷 写真アップロード</div>

    <!-- Upload zone (shown when no photo) -->
    <div id="uploadZone" class="upload-zone">
      <input type="file" id="fileInput" accept="image/*" />
      <span class="upload-icon">🤳</span>
      <div class="upload-text">タップして写真を選ぶ</div>
      <div class="upload-sub">JPG / PNG / WEBP · 最大10MB</div>
    </div>

    <!-- Photo preview (hidden until photo loaded) -->
    <div id="photoPreview" class="photo-preview hidden">
      <img id="previewImg" src="" alt="アップロード写真" />
      <label class="change-btn">
        📂 変更
        <input type="file" id="fileInputChange" accept="image/*" />
      </label>
    </div>
  </section>

  <!-- Section 2: Kimono Selection -->
  <section class="section">
    <div class="section-label">👘 着物を選ぶ</div>
    <div class="kimono-grid" id="kimonoGrid">

      <!-- Kimono 1: Sakura -->
      <div class="kimono-card" data-id="sakura" data-name="桜染め" onclick="selectKimono(this)">
        <div class="kimono-visual" style="background: linear-gradient(160deg, #fce4ec, #f8bbd0, #f48fb1);">
          <div class="kimono-check">✓</div>
          <svg viewBox="0 0 100 150" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Kimono shape -->
            <path d="M50 10 L20 40 L15 140 L85 140 L80 40 Z" fill="rgba(240,120,160,0.6)" stroke="#c06080" stroke-width="2"/>
            <!-- Collar left -->
            <path d="M50 10 L35 50 L50 55" fill="none" stroke="#c06080" stroke-width="2.5"/>
            <!-- Collar right -->
            <path d="M50 10 L65 50 L50 55" fill="none" stroke="#c06080" stroke-width="2.5"/>
            <!-- Obi (sash) -->
            <rect x="20" y="75" width="60" height="18" rx="3" fill="rgba(180,50,80,0.5)" stroke="#a03060" stroke-width="1.5"/>
            <!-- Sakura petals pattern -->
            <circle cx="35" cy="60" r="3" fill="rgba(255,255,255,0.6)"/>
            <circle cx="65" cy="55" r="3" fill="rgba(255,255,255,0.6)"/>
            <circle cx="30" cy="100" r="3" fill="rgba(255,255,255,0.6)"/>
            <circle cx="70" cy="110" r="3" fill="rgba(255,255,255,0.6)"/>
            <circle cx="50" cy="120" r="3" fill="rgba(255,255,255,0.6)"/>
            <!-- Sleeves -->
            <path d="M15 40 L5 85 L20 85 L20 40" fill="rgba(240,120,160,0.5)" stroke="#c06080" stroke-width="1.5"/>
            <path d="M85 40 L95 85 L80 85 L80 40" fill="rgba(240,120,160,0.5)" stroke="#c06080" stroke-width="1.5"/>
          </svg>
        </div>
        <div class="kimono-name" style="color:#c06080; background:#fce4ec;">桜染め</div>
      </div>

      <!-- Kimono 2: Indigo -->
      <div class="kimono-card" data-id="indigo" data-name="藍染め" onclick="selectKimono(this)">
        <div class="kimono-visual" style="background: linear-gradient(160deg, #e3f2fd, #90caf9, #42a5f5);">
          <div class="kimono-check">✓</div>
          <svg viewBox="0 0 100 150" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 10 L20 40 L15 140 L85 140 L80 40 Z" fill="rgba(30,80,160,0.65)" stroke="#1a4090" stroke-width="2"/>
            <path d="M50 10 L35 50 L50 55" fill="none" stroke="#1a4090" stroke-width="2.5"/>
            <path d="M50 10 L65 50 L50 55" fill="none" stroke="#1a4090" stroke-width="2.5"/>
            <rect x="20" y="75" width="60" height="18" rx="3" fill="rgba(10,50,120,0.6)" stroke="#0a3280" stroke-width="1.5"/>
            <!-- Wave pattern -->
            <path d="M20 60 Q30 55 40 60 Q50 65 60 60 Q70 55 80 60" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
            <path d="M20 100 Q30 95 40 100 Q50 105 60 100 Q70 95 80 100" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
            <path d="M20 120 Q30 115 40 120 Q50 125 60 120 Q70 115 80 120" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
            <path d="M15 40 L5 85 L20 85 L20 40" fill="rgba(30,80,160,0.55)" stroke="#1a4090" stroke-width="1.5"/>
            <path d="M85 40 L95 85 L80 85 L80 40" fill="rgba(30,80,160,0.55)" stroke="#1a4090" stroke-width="1.5"/>
          </svg>
        </div>
        <div class="kimono-name" style="color:#1a4090; background:#e3f2fd;">藍染め</div>
      </div>

      <!-- Kimono 3: Gold -->
      <div class="kimono-card" data-id="gold" data-name="金彩鶴" onclick="selectKimono(this)">
        <div class="kimono-visual" style="background: linear-gradient(160deg, #fff8e1, #ffe082, #ffd740);">
          <div class="kimono-check">✓</div>
          <svg viewBox="0 0 100 150" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 10 L20 40 L15 140 L85 140 L80 40 Z" fill="rgba(200,140,0,0.55)" stroke="#a07000" stroke-width="2"/>
            <path d="M50 10 L35 50 L50 55" fill="none" stroke="#a07000" stroke-width="2.5"/>
            <path d="M50 10 L65 50 L50 55" fill="none" stroke="#a07000" stroke-width="2.5"/>
            <rect x="20" y="75" width="60" height="18" rx="3" fill="rgba(140,80,0,0.5)" stroke="#805000" stroke-width="1.5"/>
            <!-- Crane motif -->
            <path d="M45 55 L35 65 M45 55 L55 60 M45 55 L42 45" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round"/>
            <circle cx="42" cy="43" r="3" fill="rgba(255,255,255,0.7)"/>
            <!-- Gold accents -->
            <circle cx="30" cy="105" r="4" fill="rgba(255,255,255,0.5)"/>
            <circle cx="70" cy="95" r="3" fill="rgba(255,255,255,0.5)"/>
            <circle cx="55" cy="118" r="3" fill="rgba(255,255,255,0.5)"/>
            <path d="M15 40 L5 85 L20 85 L20 40" fill="rgba(200,140,0,0.5)" stroke="#a07000" stroke-width="1.5"/>
            <path d="M85 40 L95 85 L80 85 L80 40" fill="rgba(200,140,0,0.5)" stroke="#a07000" stroke-width="1.5"/>
          </svg>
        </div>
        <div class="kimono-name" style="color:#a07000; background:#fff8e1;">金彩鶴</div>
      </div>

    </div>
  </section>

  <!-- Generate Button -->
  <button class="generate-btn" id="generateBtn" disabled onclick="generate()">
    <span class="btn-icon">✨</span> 着用イメージを生成
  </button>

  <!-- Loading State -->
  <div id="loadingCard" class="loading-card hidden">
    <div class="spinner"></div>
    <div class="loading-text">AIが着物姿を生成中...</div>
    <div class="loading-sub" id="loadingStatus">写真を解析しています</div>
  </div>

  <!-- Error State -->
  <div id="errorCard" class="error-card hidden">
    <div class="error-icon">⚠️</div>
    <div class="error-text" id="errorText">エラーが発生しました</div>
  </div>
  <button class="retry-btn hidden" id="retryBtn" onclick="resetResult()">もう一度試す</button>

  <!-- Result -->
  <div id="resultCard" class="result-card hidden">
    <div class="result-header">
      ✨ AI 生成結果
      <span id="resultKimonoName" style="margin-left:auto; font-size:0.75rem; opacity:0.9;"></span>
    </div>
    <div class="result-image-wrap">
      <canvas id="resultCanvas" class="result-canvas"></canvas>
      <div class="result-kimono-badge" id="resultBadge"></div>
    </div>
    <div class="result-body">
      <div class="result-desc-label">🤖 AI の着用イメージ解説</div>
      <div class="result-desc" id="resultDesc"></div>
    </div>
  </div>

</div><!-- /app -->

<script>
  // ── State ────────────────────────────────────────
  let uploadedDataURL = null;
  let selectedKimono = null;

  const KIMONOS = {
    sakura: {
      name: '桜染め',
      description: '淡いピンク色を基調とし、桜の花びらが散りばめられた優美な着物。春の宴や女性らしさを引き立てる一着。',
      color1: '#f8bbd0',
      color2: '#f48fb1',
      pattern: 'sakura',
      accent: '#c06080',
    },
    indigo: {
      name: '藍染め',
      description: '深い藍色に白抜きの波紋が美しい伝統的な藍染め着物。凛とした知性と落ち着きを演出する格調ある一着。',
      color1: '#90caf9',
      color2: '#1565c0',
      pattern: 'wave',
      accent: '#1a4090',
    },
    gold: {
      name: '金彩鶴',
      description: '黄金色の地に金彩の鶴が舞う格調高い着物。慶事や特別な場面で存在感を放つ華やかな一着。',
      color1: '#ffe082',
      color2: '#f9a825',
      pattern: 'crane',
      accent: '#a07000',
    },
  };

  // ── UI Helpers ───────────────────────────────────
  function $(id) { return document.getElementById(id); }

  function updateGenerateBtn() {
    $('generateBtn').disabled = !(uploadedDataURL && selectedKimono && $('apiKey').value.trim());
  }

  // ── Photo Upload ─────────────────────────────────
  function handleFile(file) {
    if (!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      uploadedDataURL = e.target.result;
      $('previewImg').src = uploadedDataURL;
      $('uploadZone').classList.add('hidden');
      $('photoPreview').classList.remove('hidden');
      updateGenerateBtn();
    };
    reader.readAsDataURL(file);
  }

  $('fileInput').addEventListener('change', (e) => handleFile(e.target.files[0]));
  $('fileInputChange').addEventListener('change', (e) => handleFile(e.target.files[0]));
  $('apiKey').addEventListener('input', updateGenerateBtn);

  // Drag & drop
  const zone = $('uploadZone');
  zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
  zone.addEventListener('drop', (e) => {
    e.preventDefault();
    zone.classList.remove('drag-over');
    handleFile(e.dataTransfer.files[0]);
  });

  // ── Kimono Selection ─────────────────────────────
  function selectKimono(card) {
    document.querySelectorAll('.kimono-card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    selectedKimono = card.dataset.id;
    updateGenerateBtn();
  }

  // ── Canvas Composite ─────────────────────────────
  function drawComposite(kimono) {
    const canvas = $('resultCanvas');
    const ctx = canvas.getContext('2d');
    const img = new Image();
    img.onload = () => {
      // 3:4 portrait ratio
      const w = img.naturalWidth;
      const h = img.naturalHeight;
      const targetW = 480;
      const targetH = Math.round(targetW * (h / w));
      canvas.width = targetW;
      canvas.height = targetH;

      // Draw base photo
      ctx.drawImage(img, 0, 0, targetW, targetH);

      // Kimono color overlay (lower body)
      const overlayTop = targetH * 0.35;
      const overlayH = targetH * 0.65;
      const grad = ctx.createLinearGradient(0, overlayTop, 0, targetH);
      grad.addColorStop(0, hexToRgba(kimono.color1, 0));
      grad.addColorStop(0.25, hexToRgba(kimono.color1, 0.45));
      grad.addColorStop(1, hexToRgba(kimono.color2, 0.6));
      ctx.fillStyle = grad;
      ctx.fillRect(0, overlayTop, targetW, overlayH);

      // Pattern layer
      drawPattern(ctx, kimono, targetW, targetH);

      // Subtle vignette
      const vig = ctx.createRadialGradient(targetW/2, targetH/2, targetH*0.3, targetW/2, targetH/2, targetH*0.8);
      vig.addColorStop(0, 'rgba(0,0,0,0)');
      vig.addColorStop(1, 'rgba(0,0,0,0.25)');
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, targetW, targetH);
    };
    img.src = uploadedDataURL;
  }

  function drawPattern(ctx, kimono, w, h) {
    ctx.save();
    ctx.globalAlpha = 0.3;
    if (kimono.pattern === 'sakura') {
      for (let i = 0; i < 18; i++) {
        const x = Math.random() * w;
        const y = h * 0.4 + Math.random() * h * 0.55;
        drawSakura(ctx, x, y, 10 + Math.random() * 14, kimono.accent);
      }
    } else if (kimono.pattern === 'wave') {
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 2;
      for (let row = 0; row < 6; row++) {
        const y = h * 0.45 + row * (h * 0.09);
        ctx.beginPath();
        for (let x = 0; x <= w; x += 4) {
          const wy = y + Math.sin((x / w) * Math.PI * 4) * 8;
          row === 0 && x === 0 ? ctx.moveTo(x, wy) : ctx.lineTo(x, wy);
        }
        ctx.stroke();
      }
    } else if (kimono.pattern === 'crane') {
      for (let i = 0; i < 5; i++) {
        const x = 60 + Math.random() * (w - 120);
        const y = h * 0.45 + Math.random() * h * 0.45;
        drawCrane(ctx, x, y, 20 + Math.random() * 16);
      }
    }
    ctx.restore();
  }

  function drawSakura(ctx, x, y, r, color) {
    ctx.fillStyle = color;
    for (let i = 0; i < 5; i++) {
      const angle = (i * 72 - 90) * Math.PI / 180;
      ctx.beginPath();
      ctx.ellipse(
        x + Math.cos(angle) * r * 0.55,
        y + Math.sin(angle) * r * 0.55,
        r * 0.45, r * 0.28,
        angle, 0, Math.PI * 2
      );
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,200,210,0.8)';
    ctx.beginPath();
    ctx.arc(x, y, r * 0.2, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawCrane(ctx, x, y, s) {
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    // Body
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + s, y - s * 0.3);
    ctx.stroke();
    // Neck & head
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x - s * 0.3, y - s * 0.7);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x - s * 0.3, y - s * 0.85, s * 0.15, 0, Math.PI * 2);
    ctx.stroke();
    // Wings
    ctx.beginPath();
    ctx.moveTo(x + s * 0.3, y - s * 0.1);
    ctx.lineTo(x + s * 0.2, y - s * 0.6);
    ctx.lineTo(x + s * 0.7, y - s * 0.2);
    ctx.stroke();
    // Tail
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x - s * 0.4, y + s * 0.3);
    ctx.stroke();
  }

  function hexToRgba(hex, alpha) {
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  // ── Claude API Call ───────────────────────────────
  async function callClaude(apiKey, photoBase64, photoMime, kimono) {
    const prompt = `あなたは着物スタイリストのAIです。
添付された写真の人物が「${kimono.name}」を着用したときの着用イメージを、
以下の視点から日本語で詳しく描写してください（200〜300文字程度）：
・着物の色や柄が人物にどう映えるか
・全体的な雰囲気・印象
・どんなシーンや季節に似合うか
・おすすめの帯や小物の合わせ方

${kimono.description}`;

    const body = {
      model: 'claude-opus-4-6',
      max_tokens: 512,
      messages: [{
        role: 'user',
        content: [
          {
            type: 'image',
            source: {
              type: 'base64',
              media_type: photoMime,
              data: photoBase64,
            },
          },
          { type: 'text', text: prompt },
        ],
      }],
    };

    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-client-side-api-key-override': 'true',
      },
      body: JSON.stringify(body),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error?.message || `API エラー (${res.status})`);
    }
    const data = await res.json();
    return data.content.find(b => b.type === 'text')?.text || '';
  }

  // ── Generate ─────────────────────────────────────
  async function generate() {
    if (!uploadedDataURL || !selectedKimono) return;
    const apiKey = $('apiKey').value.trim();
    if (!apiKey) { alert('APIキーを入力してください'); return; }

    const kimono = KIMONOS[selectedKimono];

    // Show loading
    setView('loading');
    $('loadingStatus').textContent = '写真を解析しています...';

    try {
      // Parse data URL
      const [header, b64] = uploadedDataURL.split(',');
      const mime = header.match(/:(.*?);/)[1];

      $('loadingStatus').textContent = 'Claude AIが着物姿を想像中...';
      const description = await callClaude(apiKey, b64, mime, kimono);

      // Draw canvas composite
      drawComposite(kimono);

      // Update result UI
      $('resultKimonoName').textContent = kimono.name;
      $('resultBadge').textContent = '👘 ' + kimono.name;
      $('resultDesc').textContent = description || '（説明の生成に失敗しました）';

      setView('result');
    } catch (e) {
      $('errorText').textContent = e.message || '不明なエラーが発生しました';
      setView('error');
    }
  }

  function setView(state) {
    $('loadingCard').classList.toggle('hidden', state !== 'loading');
    $('errorCard').classList.toggle('hidden', state !== 'error');
    $('retryBtn').classList.toggle('hidden', state !== 'error');
    $('resultCard').classList.toggle('hidden', state !== 'result');

    if (state !== 'hidden') {
      setTimeout(() => {
        const el = state === 'result' ? $('resultCard') :
                   state === 'error' ? $('errorCard') :
                   $('loadingCard');
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 100);
    }
  }

  function resetResult() {
    setView('hidden');
  }

  // ── Init ─────────────────────────────────────────
  updateGenerateBtn();
</script>
